<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14151a" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Saarathi</title>
  </head>
  <body>
    <main class="home">
      <header>
        <p class="eyebrow">Stream tools</p>
        <h1>Saarathi</h1>
        <p class="intro">Open a control page, the deck, or any OBS overlay from one place.</p>
      </header>

      <nav class="primary-links" aria-label="Controls">
        <a id="home-control" class="home-link" data-testid="home-control" href="./control.html">
          <strong>Control page</strong>
          <span>Set up Saarathi and run the stream</span>
        </a>
        <a id="home-deck" class="home-link" data-testid="home-deck" href="./deck.html">
          <strong>Stream deck</strong>
          <span>Open the large touch buttons</span>
        </a>
      </nav>

      <section aria-labelledby="overlay-heading">
        <h2 id="overlay-heading">OBS overlays</h2>
        <p id="overlay-note" class="section-note">Open one to preview it. Use the Saarathi tray to copy its paired OBS URL.</p>
        <nav id="overlay-links" class="overlay-links" aria-label="OBS overlays"></nav>
      </section>
    </main>
    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
