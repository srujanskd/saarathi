name: release

on:
  push:
    tags: ["v*"]

# The tag is the trigger, so nothing here decides a version.
jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} is not an ancestor of main. Releases are cut from the trunk."; exit 1; }

      - name: Refuse a tag whose version does not match package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          [ "$tagged" = "$declared" ] \
            || { echo "::error::tag ${GITHUB_REF_NAME} vs package.json ${declared}. Use pnpm release:* so they cannot drift."; exit 1; }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a hyphen (v0.3.0-rc.1) is a pre-release: it exists so it
          # can be installed deliberately, never handed to her by auto-update.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease

  # The installer, on the platform it installs onto. It runs after the release
  # exists because electron-builder uploads onto it: the NSIS .exe, its blockmap,
  # and latest.yml, which is the file electron-updater polls. A release without
  # this job is a release she cannot install, so it is a job and not a step.
  installer:
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The pages ship inside the installer as static files, so they are built
      # first and copied in as extraResources. See electron-builder.config.mjs.
      - run: pnpm --filter @saarathi/overlays build

      - run: pnpm --filter @saarathi/desktop build

      # --publish always uploads onto the release the job above created, which
      # is why the version in the installer is read from the root package.json
      # the tag was checked against.
      - run: pnpm --filter @saarathi/desktop exec electron-builder --config electron-builder.config.mjs --win --publish always
        env:
          GH_TOKEN: ${{ github.token }}

      # electron-builder skips an upload it thinks is incompatible with the
      # existing release and still exits 0, so a green job above is not proof
      # that anything landed. The proof is the release having the three files
      # on it: the installer, its blockmap, and the latest.yml the updater
      # polls. A release missing any of them is one she cannot install or
      # update, so it fails here rather than being discovered by her.
      - name: Refuse a release the installer did not land on
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "assets on ${GITHUB_REF_NAME}:"; echo "${names:-  (none)}"
          for want in "Saarathi-Setup-${GITHUB_REF_NAME#v}.exe" "Saarathi-Setup-${GITHUB_REF_NAME#v}.exe.blockmap" latest.yml; do
            grep -qxF "$want" <<<"$names" \
              || { echo "::error::${want} is missing from ${GITHUB_REF_NAME}. electron-builder reported success but published nothing."; exit 1; }
          done
