name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs the same checks against the tagged commit before it
  # publishes anything, so there is one definition of "green".
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # She runs this on Windows. The e2e layer spawns a real child process
        # and writes temp files, which is exactly where the two platforms
        # disagree, so it is worth the second runner.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
