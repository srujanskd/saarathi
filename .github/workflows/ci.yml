name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs the same checks against the tagged commit before it
  # publishes anything, so there is one definition of "green".
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ubuntu only: lint reads the source, and the source is the same on both.
  # The Windows runner below is about what Windows does with a child process.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  verify:
    strategy:
      fail-fast: false
      matrix:
        # She runs this on Windows. The e2e layer spawns a real child process
        # and writes temp files, which is exactly where the two platforms
        # disagree, so it is worth the second runner.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # The overlay specs drive a real browser, so they need one downloaded.
      # Chromium only and Linux only: they are about what CEF does with a
      # transform, not about what Windows does with a child process, and the
      # matrix above already covers that.
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @saarathi/overlays exec playwright install --with-deps chromium

      - if: matrix.os == 'ubuntu-latest'
        run: pnpm test:browser

      - if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/overlays/playwright-report/
          retention-days: 7
